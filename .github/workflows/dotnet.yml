name: .NET

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore ProcessadorAssincrono.slnx
    - name: Build
      run: dotnet build ProcessadorAssincrono.slnx --no-restore --configuration Release
    - name: Test
      run: dotnet test ProcessadorAssincrono.slnx --no-build --configuration Release --verbosity normal
